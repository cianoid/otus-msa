[project]
name = "otus-delivery"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"

dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.2",
    "greenlet>=3.5.3",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-instrumentation>=0.51b0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "pre-commit>=4.6.1",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]
[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "pyrefly>=1.1.1",
    "black>=26.5.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/core/tracing.py" = ["BLE001", "S112"]
"src/db.py" = ["I001"]
"src/main.py" = ["I001"]
"src/migrations/env.py" = ["I001"]
"src/models.py" = ["I001", "RUF012"]
"src/services/verify.py" = ["BLE001", "I001"]
