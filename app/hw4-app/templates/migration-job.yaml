#file: noinspection ExcessiveWhitespaceTrimInspection
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hw4-app.fullname" . }}-migrations
  labels:
    {{- include "hw4-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: {{ include "hw4-app.fullname" . }}-migrations
      labels:
        {{- include "hw4-app.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hw4-app.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}-migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres at ${HW4_APP_POSTGRES_SERVICE_HOST:-hw4-app-postgres}:${HW4_APP_POSTGRES_SERVICE_PORT:-5432}..."
              until python -c "import socket,os,sys; s=socket.socket(); s.settimeout(3); host=os.environ.get('HW4_APP_POSTGRES_SERVICE_HOST','hw4-app-postgres'); port=int(os.environ.get('HW4_APP_POSTGRES_SERVICE_PORT','5432')); s.connect((host,port)); s.close(); sys.exit(0)" 2>/dev/null; do
                sleep 2
              done
              echo "Postgres is ready, running migrations..."
              python -m alembic upgrade head
          {{- include "hw4-app.envs" . | nindent 10 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
